# ============================================================================
#                        VampireSMP Configuration File
# ----------------------------------------------------------------------------
# Every setting here is also editable in-game with /pow admin config (GUI) or
# /pow admin config set <path> <value>. Sections are grouped by system below.
# ============================================================================


# ============================================================================
# WEREPIRES NETWORK
# ============================================================================
# Connect this server to the global WerePires network dashboard.
# Get your Supabase URL and service key from your Supabase project settings.

werepires-network:
  server-key: ""
  worlds-repo: "Rockoran/werepires-world1"


# ============================================================================
# SERVER / GENERAL
# ============================================================================

# Require the VampireSMP Compatibility Mod (skins + ghost). Players without it are
# kicked a few seconds after joining (players with vampiresmp.modgate.bypass — default op — are exempt).
require-compatibility-mod: true

# Disable non-essential (info-level) logging to reduce console noise.
# When true, only warnings and errors will appear in console.
# Default: false (all logging enabled)
disable-nonessential-logging: false

# Ghost / haunt mode performance.
# Ghosts fly and noclip freely, so each one loads & ticks chunks wherever it roams. To stop the
# server lag from stacking with every active ghost, each ghost gets a small per-player view and
# simulation distance (these only affect ghosts; living players are unaffected). Minimum 2.
ghost:
  view-distance: 4        # how many chunks a ghost can see/load (lower = less lag, more fog)
  simulation-distance: 2  # how many chunks tick around a ghost (lower = less lag)


# ============================================================================
# CORE GAMEPLAY
# ============================================================================

# Controls the percentage of damage reduction for all players.
# Valid values: 0-100 (0 = no suppression, 100 = no damage taken). Default: 50
damage_suppression: 50

# How often vampire health is checked and regenerated (in ticks; 20 ticks = 1 second).
# Default: 9 ticks (0.45 seconds)
vampire_health_check_ticks: 9

# Allow players to permanently kill themselves with /pow permakill (a confirmation is shown).
# Admins can always use /pow admin permakill <player> regardless of this setting.
allow-self-permakill: true


# ============================================================================
# BROADCAST MESSAGES
# ============================================================================
# Use & for color codes. Kept deliberately nameless — a feeling, not a report.
messages:
  # Shown to everyone (except the victim) when a human permanently dies. No name is revealed.
  human-permadeath:
    enabled: true
    to-vampires: "&4A mortal soul slips beneath the veil... somewhere, the night grows one heartbeat richer."
    to-humans: "&cA cold dread settles over you... somewhere, one of the living has drawn their final breath."


# ============================================================================
# ABILITIES THAT SURVIVE THE TURN
# ============================================================================
# Normally being turned into a vampire strips every tome ability the player had — the
# tome_ability_* tags are deleted outright. This section lets named abilities live through it.
# Manage it in-game with /pow ability.
allow:
  use:
    after:
      turned:
        # Master switch. With this false nothing below has any effect.
        enabled: false

        # Abilities that keep working after the player is turned.
        # Use the exact ability name, or a single "*" entry to mean every ability.
        #   abilities: ["Blessing", "StopTheBleeding"]
        #   abilities: ["*"]
        abilities: []

        # Keep the tome_ability_* tag through the turn. This must be true for the above to do
        # anything — with it false the tag is deleted on turning and the ability is gone for good,
        # even if the name is on the allow-list.
        keep-on-turn: true

        # Turned players may also carry the physical tome books. Off by default: keeping the
        # ability is one thing, but tomes searing a vampire's hands is a separate flavour rule.
        allow-tome-items: false


# ============================================================================
# FAE — BARGAINS
# ============================================================================
# A fae is a player tagged with /pow admin fae <player>. The tag grants nothing on its own; it
# unlocks /pow faedeal, where a fae can pin a human into a vampire stage of their choosing.
fae:
  enabled: true

  # Which stages a fae may pin someone to.
  allowed-stages: [1, 2, 3]

  # Bargains survive the fae by default. Pass true as the final argument to
  # /pow faedeal vampire <player> <stage> true to bind that deal to the fae's permanent life.

  # When a bargain breaks, does the bound vampire turn back into a human?
  # false leaves them a vampire but frees them from the locked stage.
  revert-to-human-on-break: true

  # Also tag reverted players as CuredVampire. That tag makes a vampire kill permanent for them
  # instead of re-turning them, so this is a significant buff to the freed player — off by default.
  mark-as-cured-on-break: false

  # Fae-turned vampires cannot sire anyone themselves (applies the no_vampire_turn lock).
  turned-cannot-turn: true

  # Fae-turned vampires can be staked to death at their locked stage, ignoring
  # combat.permadeath-minimum-stage. This is what makes a high-stage bargain a real risk.
  staking-ignores-minimum-stage: true

  # Announce to the server when a fae's death unravels their bargains.
  broadcast-on-break: true

  # Whether /pow faedeal deaths|hearts|canturn|canbeturned|turnlocks may target anyone,
  # or only players the fae has an active bargain with.
  subcommands-target-any-player: true


# ============================================================================
# CHAT SYSTEM
# ============================================================================
chat:
  # Enable/disable the first message blocking feature for immersion
  # When enabled, player's first chat message each session is intercepted with an immersion warning
  # Default: true (blocking enabled)
  first-message-blocking-enabled: true

  # The message shown when a player's first chat message is blocked
  # Use [Click Here] to add a clickable link that sends the message - if omitted, no link is shown
  first-message-blocked-message: "&eIt looks like you've attempted to send a message! Vampire SMP is geared to revolve around immersion, consider finding the person you need to speak to, or messaging them on discord. If you still need to send your chat message, [Click Here]&e. This prevention message will not appear again until your next log on if you do choose to send your message via the blue text."


# ============================================================================
# VAMPIRE SETTINGS
# ============================================================================
vampire:
  # Respawn location for vampire players (x,y,z coordinates)
  # Default: 40,101,-113 (the vampire crypt)
  respawn-location: "40,101,-113"

  # Controls whether all vampires will automatically have their turning toggled off after a new vampire is created.
  # Default: true
  disable-turning-after-turn: true

# ── New vampire indicator ──────────────────────────────────────────────────
vampire-indicator:
  # Controls whether vampires will see a message in their action bar when a player is turned.
  # Default: true
  enabled: true

  # How long the indicator stays visible.
  # Default: 120 seconds (2 minutes)
  duration-seconds: 120

  # Radius of the indicator broadcast (ignoring y-position). Vampires farther than this distance from the new vampire will not be alerted.
  # A radius of 0 means all vampires see the indicator regardless of distance.
  # Default: 0 blocks
  distance: 0

  # Controls whether the indicator includes the distance and direction to the new vampire.
  # Default: true
  tracker: true

  # Minimum vampire stage for the indicator to be visible.
  # All vampires this stage and above will see the indicator.
  # Valid values: 1, 2, or 3
  # Default: 1
  minimum-stage: 1

# ── Thirst ─────────────────────────────────────────────────────────────────
thirst:
  # Time it takes for vampire thirst to deplete from full to empty (in minutes)
  # Default: 120 minutes (2 hours)
  depletion-minutes: 120

  # Maximum thirst points a vampire can gain from feeding per session
  # Default: 60
  max-feeding-per-session: 60

# ── Skin Shuffle: vampire stage skins ──────────────────────────────────────
# When enabled, the plugin changes a player's skin automatically when they
# tier up or tier down as a vampire, and restores their original skin on cure.
# Set each stage to the Minecraft username whose skin should be applied.
# Leave blank ("") to keep the player's own skin at that stage.
vampire-skins:
  enabled: true
  stage1: ""
  stage2: ""
  stage3: ""


# ============================================================================
# ABILITIES  (cooldowns in seconds; 20 ticks = 1 second)
# ============================================================================
abilities:
  # ── Vampire abilities ──────────────────────────────────────────────────────
  vampire:
    # Bat transformation cooldown (default: 900 seconds = 15 minutes)
    # Per-stage values override the base if present; omit a stage key to fall back to bat-cooldown.
    bat-cooldown: 900
    bat-cooldown-stage1: 900
    bat-cooldown-stage2: 900
    bat-cooldown-stage3: 900

    # Bat form duration in seconds per stage (fallback chain: stage key → bat-duration-seconds → 120)
    bat-duration-seconds: 120
    bat-duration-seconds-stage1: 120    # 2 minutes
    bat-duration-seconds-stage2: 120    # 2 minutes
    bat-duration-seconds-stage3: 180    # 3 minutes

    # Lunge attack cooldown in seconds (per-stage overrides fall back to lunge-cooldown)
    lunge-cooldown: 45
    lunge-cooldown-stage2: 45
    lunge-cooldown-stage3: 45

    # Lunge launch power per stage (velocity multiplier)
    lunge-strength-stage2: 2.0
    lunge-strength-stage3: 2.5

    # Vanish/Invisibility cooldown in seconds (per-stage overrides fall back to vanish-cooldown)
    vanish-cooldown: 420
    vanish-cooldown-stage2: 420
    vanish-cooldown-stage3: 420

    # Vanish duration in seconds per stage (default: 120s stage2, 240s stage3)
    vanish-duration-seconds-stage2: 120
    vanish-duration-seconds-stage3: 240

    # Vanish: number of attacks before invisibility breaks (per stage)
    vanish-attack-limit-stage2: 3
    vanish-attack-limit-stage3: 3

    # Storm Call cooldown (default: 7200 seconds = 2 hours)
    storm-call-cooldown: 7200
    # Storm Call duration in seconds (default: 600 = 10 minutes)
    storm-call-duration-seconds: 600
    # Ticks of clear weather locked in after the storm ends (prevents immediate re-rain).
    # Default: 6000 ticks (5 minutes)
    storm-clear-weather-ticks: 6000

    # Shadow Travel channel time before teleport fires (in ticks; 100 = 5 seconds)
    # Default: 100 ticks
    beacon-teleport-channel-ticks: 100
    # Beacon Teleport cooldown in seconds (per-stage overrides fall back to beacon-teleport-cooldown)
    beacon-teleport-cooldown: 300
    beacon-teleport-cooldown-stage2: 300
    beacon-teleport-cooldown-stage3: 300
    # Require full health to use Beacon Teleport (default: true)
    beacon-teleport-require-full-health: true

    # Vampire Vision cooldown (default: 1 second)
    vampire-vision-cooldown: 1

    # ── New vampire abilities (each can be disabled and tuned) ────────────────
    # Mist Form (s2): blink forward through walls, briefly untouchable.
    mistform:
      enabled: true
      cooldown: 30          # seconds
      distance: 8.0         # max blocks blinked
      protect-ticks: 30     # ticks of resistance + invisibility after the blink
    # Sanguine Bite (s2): bite the human in front, healing + slaking thirst.
    sanguinebite:
      enabled: true
      cooldown: 20
      range: 4.0
      damage: 4.0           # damage dealt to the human (2 hearts)
      heal: 6.0             # health restored to the vampire (3 hearts)
      quench: 15            # thirst restored
    # Hypnotic Gaze (s3): cloud a looked-at human's mind. Garlic blocks it.
    hypnoticgaze:
      enabled: true
      cooldown: 45
      range: 12
      duration-ticks: 100
      slowness-amplifier: 2
      blindness-ticks: 60
    # Bloodscent (s1): wounded humans glow with red motes only you see.
    bloodscent:
      enabled: true
      cooldown: 30
      radius: 40.0
      health-threshold: 10.0  # humans at/below this HP are revealed
      duration-ticks: 200
      interval-ticks: 10
    # Crimson Veil (s3): blood mist heals vampires, weakens humans.
    crimsonveil:
      enabled: true
      cooldown: 120
      radius: 8.0
      duration-ticks: 200
      interval-ticks: 20
      vampire-regen-amplifier: 0
      human-weakness-amplifier: 0
    # Call the Swarm (s2): bats blind and harry nearby humans.
    callswarm:
      enabled: true
      cooldown: 60
      radius: 10.0
      duration-ticks: 120
      chip-damage: 1.0
      blindness-ticks: 40
      spawn-bats: true      # spawn real fluttering bats (cosmetic) vs particles only
      bat-count: 6          # how many bats to summon when spawn-bats is true
    # Sire's Command (s3): buff your bonded thralls.
    sirescommand:
      enabled: true
      cooldown: 90
      duration-ticks: 200
      strength-amplifier: 0
      speed-amplifier: 0

  # ── Tome (human) abilities ─────────────────────────────────────────────────
  tome:
    # Blessing cooldown (default: 7200 seconds = 2 hours)
    blessing-cooldown: 7200
    # Banish Undead cooldown (default: 900 seconds = 15 minutes)
    banish-undead-cooldown: 900
    # Holy Word cooldown (default: 600 seconds = 10 minutes)
    holy-word-cooldown: 600
    # Enlightened Eye cooldown (default: 900 seconds = 15 minutes)
    enlightened-eye-cooldown: 900
    # Lantern Thrash cooldown (default: 300 seconds = 5 minutes)
    lantern-thrash-cooldown: 300
    # Prayer of Faith cooldown (default: 900 seconds = 15 minutes)
    prayer-of-faith-cooldown: 900
    # Rallying Cry cooldown (default: 1200 seconds = 20 minutes)
    rallying-cry-cooldown: 1200
    # Shoulder Barge cooldown (default: 300 seconds = 5 minutes)
    shoulder-barge-cooldown: 300
    # Turn Undead cooldown (default: 1800 seconds = 30 minutes)
    turn-undead-cooldown: 1800
    # Uncanny Direction cooldown (default: 30 seconds)
    uncanny-direction-cooldown: 30
    # Unnatural Haste cooldown (default: 900 seconds = 15 minutes)
    unnatural-haste-cooldown: 900
    # Way of the Land cooldown (default: 600 seconds = 10 minutes)
    way-of-the-land-cooldown: 600
    # Way of the Lumberjack cooldown (default: 600 seconds = 10 minutes)
    way-of-the-lumberjack-cooldown: 600
    # Way of the Prospector cooldown (default: 600 seconds = 10 minutes)
    way-of-the-prospector-cooldown: 600
    # Stop the Bleeding cooldown (default: 7200 seconds = 2 hours)
    stop-the-bleeding-cooldown: 7200

    # ── Classic tome ability tuning ──────────────────────────────────────────
    # Holy Word: paralysis radius and duration.
    holyword:
      radius: 20                     # blocks — vampires within this range are paralysed
      paralysis-duration-ticks: 300  # 15 seconds
    # Shoulder Barge: charge duration and upward launch velocity.
    shoulderbarge-charge:
      charge-duration-ticks: 20      # how many ticks the collision window lasts (1 second)
      upward-velocity: 0.3           # upward component applied on barge launch
      target-cooldown-ms: 3000       # ms before the same target can be barged again
    # Uncanny Direction: compass animation duration.
    uncannydirection:
      animation-ticks: 140           # total ticks the direction HUD displays (7 seconds)
    # Banish Undead: sweep radius for removing undead mobs.
    banishundead:
      radius: 40                     # blocks
    # Lantern Thrash: fire ring parameters.
    lanthrash:
      fire-radius: 6                 # outer radius of the fire ring (blocks)
      fire-inner-radius: 2           # inner exclusion radius (blocks)
      fire-resistance-duration-ticks: 6000  # Fire Resistance given to caster
    # Rallying Cry: group strength buff.
    rallyingcry:
      radius: 20.0                   # blocks — affects caster + nearby humans
      strength-duration-ticks: 600   # 30 seconds
      strength-amplifier: 0          # 0 = Strength I
    # Shoulder Barge: charge and collision parameters.
    shoulderbarge:
      charge-velocity: 1.5
      knockback-strength: 1.2
      slowness-duration-ticks: 300   # 15 seconds
      damage-to-players: 10.0
      damage-to-mobs: 20.0
    # Turn Undead: undead disguise + on-cast debuffs.
    turnundead:
      disguise-duration-ticks: 6000  # 5 minutes
      darkness-ticks: 200
      slowness-ticks: 100
    # Unnatural Haste: haste duration and level.
    unnaturalhaste:
      haste-duration-ticks: 6000     # 5 minutes
      haste-amplifier: 1             # 1 = Haste II
    # Prayer of Faith: still-prayer for absorption.
    prayeroffaith:
      channel-seconds: 60
      absorption-duration-ticks: 12000  # 10 minutes
      absorption-amplifier: 2           # 2 = Absorption III
    # Stop the Bleeding: channeled heal.
    stopthebleeding:
      channel-ticks: 1200            # 60 seconds
      proximity-distance: 2.0        # max blocks between healer and target
    # Enlightened Eye: night vision duration.
    enlightenedeye:
      night-vision-duration-ticks: 6000  # 5 minutes
    # Way of the Land: double-crop-drop chance.
    wayoftheland:
      double-drop-chance: 0.75       # 75% chance of double drops
    # Way of the Lumberjack: double-log-drop chance.
    wayofthelumberjack:
      double-drop-chance: 0.30       # 30% chance of double drops

    # ── New tome abilities (each can be disabled and tuned) ───────────────────
    # Consecrate Ground: heal humans / sear vampires in an area.
    consecrateground:
      enabled: true
      cooldown: 120         # seconds
      radius: 6.0
      duration-ticks: 200
      interval-ticks: 20
      vampire-damage: 1.0
    # Blessed Blade: your strikes against vampires deal bonus damage + weakness.
    blessedblade:
      enabled: true
      cooldown: 90
      duration-ticks: 200   # how long the blade stays blessed
      bonus-multiplier: 1.5 # damage multiplier vs vampires
      weaken-ticks: 100
      weaken-amplifier: 0
    # Daybreak: a pillar of daylight that burns vampires.
    daybreak:
      enabled: true
      cooldown: 120
      radius: 5.0
      duration-ticks: 100
      interval-ticks: 20
      vampire-damage: 2.0
      fire-ticks: 40
    # Sanctuary: shield yourself + nearby humans with resistance.
    sanctuary:
      enabled: true
      cooldown: 120
      radius: 6.0
      duration-ticks: 100
      resistance-amplifier: 3
    # Cleansing Smoke: garlic cloud — fling back/weaken vampires, shield humans.
    cleansingsmoke:
      enabled: true
      cooldown: 90
      radius: 6.0
      shield-ticks: 120
      vampire-weaken-ticks: 100
      knockback: 1.2
    # Fading: ease your own opacity between solid and gone.
    #   /pow tome fading          - toggle between 100 and minimum-opacity
    #   /pow tome fading <0-100>  - ease to a specific opacity
    # Requires the compatibility mod to render; the server only applies real invisibility.
    fading:
      enabled: true
      # Seconds before Fading can be used again. Nothing interrupts a fade once started —
      # this limits how often you can drop out of sight, not how long you stay there.
      cooldown: 300
      # Maximum seconds a fade may remain active before automatically returning to 100%.
      # Set to 0 for unlimited duration.
      duration-seconds: 15

      # Rockoran bypasses cooldown and gains noclip + flight at 0% while /z184761 is on.
      # That is built into the plugin; the vampiresmp.fading.bypass permission grants the same.
      # Opacity units per second while easing toward the target. 100 = effectively instant.
      fade-speed: 25
      # At or below this opacity the player also gets real INVISIBILITY (mobs lose them).
      invisible-at: 0
      # Floor on how far anyone may thin out. Raise above 0 to forbid vanishing completely.
      minimum-opacity: 0
      # Snap back to fully visible on login, so a crash mid-fade cannot strand someone invisible.
      reset-on-join: true
      # Block use outside an active session.
      require-session: true

    # Scrying: point the vampire indicator arrow at another player for a while.
    # A target name is required: /pow tome scrying <player>
    # (To keep it out of chest/vault loot, comment it out of tome-chest-items.tomes-available.)
    scrying:
      enabled: true
      cooldown: 180
      # How long the arrow stays on the action bar.
      duration-seconds: 20
      # Furthest the target may be when the ability is cast. 0 = no limit.
      # The arrow itself keeps working past this once it has started.
      max-range: 0
      # Restrict scrying to vampires only. false lets a hunter track any player by name.
      vampires-only: false
      # Tell the target they are being scryed, so it is not a free one-sided wallhack.
      notify-target: true
    # Hunter's Mark: make a looked-at vampire glow for everyone.
    huntersmark:
      enabled: true
      cooldown: 90
      range: 24
      duration-ticks: 300
    # Last Vigil: a desperate stand — resistance, regen and absorption.
    lastvigil:
      enabled: true
      cooldown: 120
      duration-ticks: 120
      resistance-amplifier: 2
      regeneration-amplifier: 1
      absorption-amplifier: 1
    # Fire Breath: exhale a cone of flame that ignites and damages enemies.
    firebreath:
      cooldown: 600             # seconds (default: 10 minutes)
      range: 8.0                # length of the cone in blocks
      cone-angle: 35.0          # half-angle of the cone in degrees
      duration-ticks: 20        # how many ticks the breath stream lasts
      particles-per-tick: 28    # particles sprayed per tick
      damage: 4.0               # damage dealt every 4 ticks to targets in cone
      fire-ticks: 100           # ticks targets are set on fire (100 = 5 seconds)
    # Magic Fire Breath: magic-flame variant, longer range and tighter cone.
    magicfirebreath:
      cooldown: 900             # seconds (default: 15 minutes)
      range: 12.0               # length of the cone in blocks
      cone-angle: 28.0          # half-angle of the cone in degrees
      duration-ticks: 25        # how many ticks the breath stream lasts
      particles-per-tick: 32    # particles sprayed per tick
      damage: 6.0               # damage dealt every 4 ticks to targets in cone
      fire-ticks: 160           # ticks targets are set on fire (160 = 8 seconds)


# ============================================================================
# CURE & HOLY WATER
# ============================================================================
cure:
  # The maximum distance a vampire (and the caster of a force cure, if applicable) can be from a holy beacon.
  # Default: 25.0 blocks
  cure-distance: 25.0

  # How many links up the sire chain can still be alive for the cure to be valid.
  # 1 = only your direct sire must be dead. 2 = sire AND sire's sire must be dead, etc.
  # Default: 1
  sire-line-length: 1

  # Controls whether the fledglings of a cured player can be cured. If false, a vampire can be cured only if their direct sire is dead.
  # Default: false
  allow-cured-sire: false

  # Controls whether the cure must be performed during the day. If false, the cure can be done any time of day.
  # Default: true
  needs-daytime: true

# Whether cure books (1/3, 2/3, 3/3) should spawn in tome chest distribution. Default: true
cure_books_enabled: true

# Chance for a cure book to spawn in remaining empty chests (0.0 to 1.0). Default: 0.3
cure_books_spawn_chance: 0.3

# Whether "The Retribution 4/3" book should spawn in tome chests. Default: false
fourth_book_spawn_enabled: false

# ── Holy water ─────────────────────────────────────────────────────────────
holy-water:
  # Duration of the holy water disable effect on vampires (in seconds)
  # Default: 120 seconds (2 minutes)
  disable-duration-seconds: 120


# ============================================================================
# REVIVAL — RITE OF RETURN
# ============================================================================
# A forbidden ritual that calls a ghost back to life. The reviver must have read all four revival
# books, hold a vial of vampire blood (consumed), perform it at night, and stand at a desecrated
# beacon (which is consumed -> reset to neutral). The target ghost must linger nearby.
# Latin command: /sanguine-et-nocte-te-ex-umbra-revoco <player>
# Give books for testing: /pow admin give_revival_book <player> <1-4>
revival:
  enabled: true
  # What a revived soul returns as: vampire | human | thrall | ghoul
  outcome: vampire
  # Max distance the target ghost (and the desecrated beacon) may be from the reviver
  range: 25.0
  # Require night to perform the rite
  needs-night: true
  # Spawn revival books in tome chests (like cure books)
  books-in-chests: true
  books-spawn-chance: 0.2
  # In an ominous (cure) vault, chance the reward is a revival book instead of a cure book
  ominous-vault-revival-chance: 0.5
  ghoul:
    # Reduced max health a ghoul revives with (20 = full; 14 = 7 hearts)
    max-health: 14.0


# ============================================================================
# BEACON SYSTEM
# ============================================================================
beacons:
  # Radius (in blocks) within which a player must stand to capture a beacon.
  # Default: 10 blocks
  capture-radius: 10

  # Base conversion time for beacons (in seconds)
  # Default: 300 seconds (5 minutes)
  conversion-time-seconds: 300

  # Cooldown after converting a beacon before it can be converted again (in minutes)
  # Default: 60 minutes (1 hour)
  conversion-cooldown-minutes: 60

  # Speed multiplier for humans converting beacons
  # Default: 1.5 (50% faster than vampires)
  human-speed-multiplier: 1.5

  # Speed multiplier for single human "Final Stand" scenario
  # Default: 6.0 (6x faster conversion when one human remains)
  final-stand-multiplier: 6.0

  # Delay before announcing neutral beacon conversions (in seconds)
  # Default: 60 seconds (beacon texture changes immediately, announcement is delayed)
  neutral-announcement-delay-seconds: 60

  # Whether corrupted beacons trap humans by counting toward the total required to leave
  # When true (default), corrupted beacons count as desecrated — humans can never reclaim them
  # When false, corrupted beacons are excluded from the total for both sides
  corrupted-beacons-trap-humans: true


# ============================================================================
# TOMES, TOME CHESTS & VAULTS
# ============================================================================

# How often tomes are distributed to chests (in minutes). Default: 20
tome-distribution-interval-minutes: 20

tome-chest-items:
  # How many tome books spawn every time tomes are distributed. The remaining tome chests will be filled with enchanted books.
  # Default: 4
  tome-count: 4

  # Which tome abilities will spawn in tome chests (and tome vaults).
  # If this list is empty, the default is used.
  tomes-available:
  - BanishUndead
  - Blessing
  - EnlightenedEye
  - HolyWord
  - LanternThrash
  - PrayerOfFaith
  - RallyingCry
  - ShoulderBarge
  #- StopTheBleeding
  - TurnUndead
  - UncannyDirection
  - UnnaturalHaste
  - WayOfTheLand
  - WayOfTheLumberjack
  - WayOfTheProspector
  - ConsecrateGround
  - BlessedBlade
  - Daybreak
  - Sanctuary
  - CleansingSmoke
  - HuntersMark
  - LastVigil
  - Scrying
  - Fading

  # Which enchantments and their level will spawn in the tome chests.
  # If this list is empty, the default is used.
  enchantments-available:
  - efficiency 1
  - protection 1
  - feather_falling 1
  - knockback 1
  - sweeping_edge 1

  # How many miscellaneous items spawn every time tomes are distributed.
  # Default: 0
  misc-items-count: 0

  # Which miscellaneous items (and optional amounts) will spawn in tome chests.
  misc-items:
    - SPLASH_POTION # Holy Water
    - COBWEB 4

# Tome chest locations. Format: "x,y,z" — use /pow admin addtomechest to add in-game.
tome-chests:
  locations:
    - "202,61,-305"
    - "416,45,-109"
    - "504,139,398"
    - "494,125,593"
    - "153,99,128"
    - "-19,104,100"
    - "-125,71,421"
    - "76,80,407"
    - "-397, 82, 364"

# Tome / Ominous-Cure vaults: real vanilla VAULT blocks whose reward is swapped to a tome / cure
# book. They behave exactly like trial-chamber vaults — unlock with a Trial Key (tome) or Ominous
# Trial Key (cure), once per player, with the loot shown floating above. Manage with
# /pow admin addtomevault | removetomevault | listtomevault and the addominouscurevault family.
# Locations are stored below as "world,x,y,z" — edit via the commands, not by hand.
vaults:
  tome: []
  cure: []


# ============================================================================
# IRON WEAKNESS
# ============================================================================
# Stage 2+ vampires are repelled by iron blocks and weakened near iron items.
iron-weakness:
  # Distance (blocks) at which an iron block physically repels the vampire.
  # Default: 2.0
  repel-distance: 2.0

  # Velocity applied when repelling a vampire from an iron block.
  # Default: 0.5
  repel-strength: 0.5

  # Radius (blocks) checked each second for iron proximity weakness.
  # Default: 5.0
  proximity-radius: 5.0

  # Duration of the Weakness effect applied when near iron (in ticks; 20 = 1 second).
  # Should be slightly longer than the check interval (20 ticks) to stay continuous.
  # Default: 40 ticks (2 seconds)
  weakness-duration-ticks: 40

  # Amplifier of the Weakness effect (0 = Weakness I, 1 = Weakness II, 2 = Weakness III).
  # Default: 2 (Weakness III)
  weakness-amplifier: 2


# ============================================================================
# GARLIC (BEETROOT) SYSTEM
# ============================================================================
garlic:
  # Processing time range in seconds (time for garlic to take effect after eating)
  # Default: 480 seconds (8 minutes) minimum
  processing-time-min-seconds: 480
  # Default: 720 seconds (12 minutes) maximum
  processing-time-max-seconds: 720

  # Immunity duration range in seconds (how long immunity lasts)
  # Default: 480 seconds (8 minutes) minimum
  immunity-duration-min-seconds: 480
  # Default: 600 seconds (10 minutes) maximum
  immunity-duration-max-seconds: 600


# ============================================================================
# COMBAT & PERMADEATH
# ============================================================================
combat:
  # Maximum HP cap imposed on vampires during the "one human left" Final Stand phase.
  # Default: 6.0 (3 hearts)
  humans-final-stand-health-cap: 6.0

  # Maximum deaths recorded on the scoreboard for a human player (excess is clamped).
  # Default: 5
  human-death-score-cap: 5

  # HP penalty subtracted per death for humans under beacon majority bonus.
  # Default: 2.0 (1 heart per death)
  human-death-hp-penalty: 2.0

  # Death count at or above which being killed by a vampire is PERMANENT, regardless of the
  # victim's own /pow permadeath setting.
  # Admins can move a player toward or away from this line with:
  #   /pow admin deaths <player> <add|remove> <n>   (or the hearts alias)
  # Keep this at or below human-death-score-cap, or it can never be reached.
  # Default: 5
  vampire-kill-permadeath-threshold: 5

  # Whether the threshold above applies to EVERY vampire kill.
  # true  - 5+ deaths means a vampire kill is always permanent.
  # false - legacy behaviour: the threshold is only checked when the killing vampire has
  #         turning switched off; with turning on, the victim is turned into a vampire instead.
  # Default: true
  vampire-kill-permadeath-always: true

  # Maximum vampire stage that can be staked for permadeath
  # Vampires at this stage or BELOW can be perma-killed by wooden stakes
  # Valid values: 1, 2, or 3
  # Default: 1 (only Stage 1 vampires can be staked)
  permadeath-minimum-stage: 1

  # Wooden stake cooldown in ticks (20 ticks = 1 second)
  # This is the cooldown applied after using a wooden stake before another can be used
  # Default: 80 ticks (4 seconds)
  wooden-stake-cooldown-ticks: 80


# ============================================================================
# WORLD: SPAWNING & OAKHURST
# ============================================================================
passive-mob-spawning:
  # Enable automatic spawning every in-game morning
  # Default: true
  auto-spawn-enabled: true

  # Minimum number of passive animals required before spawning is skipped
  # If animal count is below this threshold, spawning will occur
  # Default: 40
  minimum-animal-threshold: 40

  # Number of animals to spawn per cycle (morning auto-spawn or /pow admin spawnanimals)
  # Default: 80
  spawn-count: 80

  # Weighted spawn table — higher weight = more likely to be chosen.
  # Only EntityType names recognized by Bukkit are valid. Unknown names are skipped with a warning.
  mob-weights:
    COW: 30
    PIG: 30
    SHEEP: 25
    CHICKEN: 15

oakhurst:
  # Alternate name (what to call the map instead of Oakhurst)
  name: Oakhurst

  # Town center (the main settlement location)
  # Used for teleportation and direction-based abilities like Uncanny Direction
  town-center-x: 79
  town-center-z: 440

  # Teleport radius - how far from town center players can be randomly teleported
  # Default: 400 blocks
  teleport-radius: 400

  # Playable area boundary settings
  # The border is defined by a center point and diameter (total width)
  border:
    # Center of the playable area
    center-x: 50
    center-z: 50
    # Total width/height of the playable area (creates a square area)
    # With center at 50 and diameter 1098: boundaries are -499 to 599
    diameter: 1098


# ============================================================================
# WEREWOLF SETTINGS
# ============================================================================
werewolf:

  # ── Werewolf combat ────────────────────────────────────────────────────────
  combat:
    # Damage multiplier applied when hitting a werewolf with an iron weapon (silver weakness)
    # Default: 1.75 (75% extra damage on top of base)
    silver-weakness-multiplier: 1.75

    # Bare-fist damage multipliers per stage (applied to base hit damage)
    # Stage 1 has no bonus. Stage 2 and 3 gain increasing claw power.
    # Default stage 2: 1.5, stage 3: 2.5
    fist-multiplier-stage2: 1.5
    fist-multiplier-stage3: 2.5

  # ── Biting (turning) ───────────────────────────────────────────────────────
  biting:
    # Maximum distance (in blocks) between biter and victim before the bite is cancelled
    # Default: 3.5 blocks
    max-distance: 3.5

    # Ticks of continuous biting before the victim receives a warning message (20 ticks = 1 second)
    # Default: 200 ticks (10 seconds)
    notify-ticks: 200

    # Total ticks from bite start until turning completes
    # Default: 300 ticks (15 seconds total — 10s silent + 5s after notification)
    complete-ticks: 300

  # ── Pack bonus ─────────────────────────────────────────────────────────────
  pack:
    # Radius in blocks to search for nearby pack members
    # Default: 20.0 blocks
    radius: 20.0

    # Duration (in ticks) that pack potion effects last before the next refresh cycle
    # Should be slightly longer than check-interval-ticks to avoid gaps
    # Default: 80 ticks (4 seconds)
    effect-duration-ticks: 80

    # How often (in ticks) the pack bonus is recalculated and reapplied
    # Default: 60 ticks (3 seconds)
    check-interval-ticks: 60

  # ── Hunger (mirrors ThirstManager — bar drains over time, meat refills it) ──
  # Hitting 1.0 promotes the wolf; hitting 0.0 demotes and stage-caps them.
  # After any stage change, 15-minute immunity prevents immediate drain.
  hunger:
    # Minutes for the hunger bar to drain completely from 1.0 to 0.0
    # Default: 20
    depletion-minutes: 20

    # How much the hunger bar fills per piece of meat eaten (0.0 - 1.0)
    # 0.10 = 10 pieces fills the bar from empty; bar starts at 0.25 after promotion
    # Default: 0.10
    hunger-per-meat: 0.10

    # Minutes of hunger immunity granted after a stage promotion or demotion.
    # Default: 15 minutes
    immunity-minutes: 15

  # ── Werewolf ability cooldowns (seconds) ───────────────────────────────────
  abilities:
    # Feral Charge cooldown (default: 12 seconds)
    feral-charge-cooldown: 12

    # Feral Charge launch power per stage (velocity multiplier)
    # Stage 2: forward burst, Stage 3: stronger burst
    # Default stage 2: 2.0, stage 3: 3.0
    feral-charge-power-stage2: 2.0
    feral-charge-power-stage3: 3.0


# ============================================================================
# THRALL SYSTEM
# ============================================================================
thrall:

  # Maximum thralls any one vampire can own (0 = no limit)
  max-thralls: 3

  # Global cap on total active thralls across the server (0 = no limit)
  global-cap: 0

  # Allow a thrall to be bonded to two separate masters simultaneously
  dual-master-enabled: true

  # Automatically sever thrall bonds when the thrall turns vampire
  auto-unthrall-enabled: true

  # Stage progression mode:
  #   "bottles" — accumulate blood bottles to advance stages
  #   "timer"   — one dose per N minutes advances a stage
  stage-mode: "bottles"

  # ── Bottles mode: bottles required to reach each stage ────────────────────
  bottles:
    stage1: 1
    stage2: 3
    stage3: 6

  # ── Timer mode: minutes between doses (one dose = one stage level) ─────────
  timer:
    dose-minutes: 60

  # ── Command success probability (%) ───────────────────────────────────────
  # Primary master: stage1 & stage2 use these; stage3 always succeeds
  chance-stage1: 50
  chance-stage2: 80
  # Secondary master probabilities per stage
  secondary-chance-stage1: 25
  secondary-chance-stage2: 50
  secondary-chance-stage3: 75

  # ── Blood draw ─────────────────────────────────────────────────────────────
  blood-draw:
    enabled: true
    # Which vampire stages are allowed to bottle their own blood
    stage1: false
    stage2: true
    stage3: true
    # Hearts of damage taken when drawing blood (1 = half a heart displayed)
    damage-hearts: 2.0
    # Cooldown between draws (seconds)
    cooldown-seconds: 30
    # Whether character profile names/tastes are embedded into blood bottle lore
    profiles-in-bottles: true

  # ── Withdrawal ─────────────────────────────────────────────────────────────
  withdrawal:
    enabled: true
    # Seconds after the last blood dose before withdrawal countdown begins
    seconds: 3600
    # Warn the thrall at this many seconds remaining
    warn-seconds: 120
    # Final warning at this many seconds remaining
    final-warn-seconds: 10
    # Cooldown between poison pulses once withdrawal is active (seconds)
    pulse-cooldown-seconds: 60
    # Duration of each poison pulse (seconds)
    poison-seconds: 8
    # Deduction mode each pulse: none / deduct / deductAfterFirst / alternating
    deduct-mode: "none"
    # What is deducted: "bottle" or "stage"
    deduct-type: "bottle"
    # Amount deducted per pulse
    deduct-amount: 1

  # ── Separation anxiety (Stage 2+) ─────────────────────────────────────────
  sep-anxiety:
    enabled: true
    # Distance from primary master that triggers anxiety (blocks)
    range: 150.0
    # Seconds between anxiety pulses
    pulse-seconds: 30
    # Duration of each effect (seconds)
    nausea-seconds: 6
    weakness-seconds: 8
    slowness-seconds: 8

  # ── Boss bar ───────────────────────────────────────────────────────────────
  boss-bar:
    enabled: true

  # ── Force offer (Stage 2+ vampires) ───────────────────────────────────────
  force:
    enabled: true
    # Max block distance from vampire to target
    range: 5.0
    # Seconds the offer GUI stays open before auto-declining
    offer-seconds: 30

  # ── Holy water ─────────────────────────────────────────────────────────────
  holy-water:
    enabled: true
    # true = gradual reduce; false = instant bond break
    gradual: true
    # Mode: "bottle" (reduce bottle count) or "stage" (reduce stage level)
    mode: "bottle"
    # How many bottles/stages to reduce per hit
    bottle-decrease: 2
    stage-decrease: 1

  # ── Stay command ───────────────────────────────────────────────────────────
  stay:
    enabled: true
    max-seconds: 60

  # ── Punish command ─────────────────────────────────────────────────────────
  punish:
    enabled: true
    range: 10.0
    duration-seconds: 8

  # ── Command (roleplay instructions to thralls) ─────────────────────────────
  command:
    enabled: true
    # How long (seconds) the command text persists in the thrall's data
    expiry-seconds: 120

  # ── Locate / findthrall ────────────────────────────────────────────────────
  locate:
    enabled: true
    # Seconds between location ping updates shown to the tracking vampire
    track-pulse-seconds: 5

  # ── Findmaster ─────────────────────────────────────────────────────────────
  findmaster:
    enabled: true

  # ── Blood taste (vampire detects a nearby thrall's character profile) ───────
  blood-taste:
    enabled: true
    # Block range to detect a nearby player's taste
    range: 5.0
    # Cooldown between taste readings (seconds)
    cooldown-seconds: 30
    # Whether to include the character's name in the taste message
    show-name: true
    # Display mode: "actionbar" or "chat"
    mode: "actionbar"

  # ── Tag offer (Stage 3 threshold choice) ───────────────────────────────────
  tag-offer:
    enabled: true
    # Scoreboard tag added if the thrall chooses "Swear to Vampirism"
    vampire-tag: "CuredVampire"

  # ── Profiles ───────────────────────────────────────────────────────────────
  profiles:
    max: 5

  # ── Command cooldowns (seconds) ────────────────────────────────────────────
  cooldowns:
    force-seconds: 600
    stay-seconds: 120
    punish-seconds: 60
    command-seconds: 30
    locate-seconds: 5

  # ── Human self blood draw ───────────────────────────────────────────────────
  # Allows humans to sneak + right-click with a glass bottle to draw their own
  # blood. Produces the same plain experience bottle as animal kill blood.
  human-blood-draw:
    # Master switch — set true to enable
    enabled: false
    # If true, only humans who are active thralls can draw their own blood
    thralls-only: true
    # Hearts of damage the human takes when drawing blood
    damage-hearts: 2.0
    # Cooldown between draws (seconds)
    cooldown-seconds: 30


# ============================================================================
# BLOOD-DRAW SETTINGS
# ============================================================================
blood-draw:

  # ── Animal blood collection ─────────────────────────────────────────────────
  # Extends the original vampire animal-kill system to other player types.
  # Kill an animal with a glass bottle in your off-hand to collect blood.
  animal:
    # Master switch
    enabled: false
    # Which player types can collect animal blood this way
    allow-vampires: true   # true preserves vanilla vampire behaviour
    allow-humans: true
    allow-thralls: true
    # Damage and cooldown applied to a successful animal blood draw
    damage-hearts: 2.0
    cooldown-seconds: 60


# ============================================================================
# STARTER KIT SYSTEM
# ============================================================================
starterkit:

  # Global enable/disable. When false, /kitstart has no effect and no kits are
  # handed out on join.
  enabled: true

  # ── Kit components ─────────────────────────────────────────────────────────
  # Each flag controls whether that portion of the kit is included.
  add-tools: true
  add-food: true
  add-bread: true
  add-torches: true
  add-book: true
  add-armor: true
  add-builder: true
  add-vampire-exp: true
  add-player-specific-items: true

  # ── Per-character custom items ─────────────────────────────────────────────
  jowoker-custom-enabled: true
  lucifer-custom-enabled: true
  marlow-custom-enabled: true
  flynnley-custom-enabled: true
  ludwig-custom-enabled: true
  worven-custom-enabled: true

  # ── Timing ─────────────────────────────────────────────────────────────────
  # Ticks after join before the kit is delivered (20 ticks = 1 second).
  join-kit-delay: 40

  # ── Builder pack ───────────────────────────────────────────────────────────
  # Maximum stacks of each material included in the builder pack.
  builder-max-stacks: 4

  # ── Broadcast flags ────────────────────────────────────────────────────────
  broadcast-kitstart: true
  broadcast-kitstop: true
  broadcast-kitall: true
  broadcast-kitgive: false


# ============================================================================
# SERVER RESOURCE PACK
# ============================================================================
# Sends this pack from the plugin when a player joins. Leave enabled false if
# server.properties or another plugin already sends the same pack.
server-resource-pack:
  enabled: true
  url: 'https://download.mc-packs.net/pack/4f52f1c8b41931ef9bd00b008fe8d308519d9b5b.zip'
  sha1: '4f52f1c8b41931ef9bd00b008fe8d308519d9b5b'
  prompt: ''
  required: false
  join-delay-ticks: 20

# ============================================================================
# CELLPHONE VOICE CALLS
# ============================================================================
phone:
  calls:
    speaker:
      # Enables two-way speakerphone mode for active Simple Voice Chat calls.
      enabled: true
      # How far away other players can hear audio coming from the phone.
      radius: 8.0
      # How far away players can speak into the phone and be heard by remote callers.
      transmit-radius: 8.0

# ============================================================================
# INTERNAL STATE TRACKING - DO NOT MODIFY
# ============================================================================
# WARNING: The following values are used by the plugin to track game state.
# Modifying these values manually during an active session may result in unexpected behavior or break the game.
# Only change these if you know exactly what you're doing!
# These values are automatically updated and reset when "/pow admin init" is completed.

# Track if any beacon has been converted yet (first time trigger for intro sequence). Default: false
first_beacon_converted: false

# Track which team controls all beacons. Default: false (not triggered yet)
humans_own_all_beacons: false
vampires_own_all_beacons: false

# Track special conditions during gameplay. Default: false (inactive)
one_human_left: false

# Track if the fourth book has already spawned. Default: false (not spawned yet)
fourth_book_has_spawned: false
