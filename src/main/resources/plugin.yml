name: WerePires
version: 1.15.15
main: pow.crimson2.VampireSMPPlugin
api-version: 1.21.5
author: PowCreations
description: WerePires vampire, werewolf, human, Fae, thrall, ghost, and roleplay systems
softdepend: [Multiverse-Core, voicechat]

commands:
  thrall:
    description: Thrall blood-bond system
    usage: /thrall <subcommand>
    permission: vampiresmp.player

  # ── Roles ──────────────────────────────────────────────────────────────────
  role:
    description: View or manage your human role
    usage: /role <vampire_hunter|tracker|medic> <optin|optout>
    permission: vampiresmp.player
  rolecfg:
    description: Configure role settings
    usage: /rolecfg [enable|disable <role>]
    permission: vampiresmp.admin
  rolestart:
    description: Randomly assign a role to one eligible player
    usage: /rolestart <role>
    permission: vampiresmp.admin
  vampire:
    description: Vampire role info
    usage: /vampire <optin|optout|select|list|clearlist|removeplayer>
    permission: vampiresmp.player
  gameadmin:
    description: Game admin utilities
    usage: /gameadmin <sub>
    permission: vampiresmp.admin
  findvampires:
    description: Scan for nearby vampires (Vampire Hunter role)
    usage: /findvampires
    permission: vampiresmp.player

  # ── Starter Kit ────────────────────────────────────────────────────────────
  kitstart:
    description: Enable the starter kit for newly joined players
    usage: /kitstart
    permission: starterkit.admin
  kitstop:
    description: Disable the starter kit
    usage: /kitstop
    permission: starterkit.admin
  kitall:
    description: Give the starter kit to all online players
    usage: /kitall
    permission: starterkit.admin
  starterkit:
    description: Open the starter kit settings GUI
    usage: /starterkit [edit]
    permission: starterkit.use
  starterkitgive:
    description: Give the starter kit to a specific player
    usage: /starterkitgive <player>
    permission: starterkit.admin
  foodkitadd:
    description: Mark a player as having received the food kit
    usage: /foodkitadd <player>
    permission: starterkit.admin
  foodkitremove:
    description: Remove a player from the food kit received list
    usage: /foodkitremove <player>
    permission: starterkit.admin
  foodkitgive:
    description: Give the food kit to a specific player
    usage: /foodkitgive <player>
    permission: starterkit.admin

  # ── Player Setup ───────────────────────────────────────────────────────────
  playersetup:
    description: Open the player setup wizard
    usage: /playersetup
    permission: vampiresmp.player

  # ── Game Start ─────────────────────────────────────────────────────────────
  gamestart:
    description: Session setup wizard
    usage: /gamestart [timer|cancel|sessionend|resumesession|breaktimer]
    permission: vampiresmp.admin

  skin:
    description: Register and manage per-stage vampire skins
    usage: /skin <register|apply|clear|list|tierdown|reload> [human|stage1|stage2|stage3|cured|ghost|on|off]
  stash_third_book:
    description: Place the third cure book in its legacy map chest
    usage: /stash_third_book
    permission: vampiresmp.admin
  stash_fourth_book:
    description: Place the fourth cure book in a chest at coordinates
    usage: /stash_fourth_book <x> <y> <z>
    permission: vampiresmp.admin
  ghost:
    description: Reveal/conceal yourself, voice-haunt a player, or stop haunting
    usage: /ghost <show|hide|showall|hideall|list|haunt|unhaunt|stop|setfree> [player]
  cellphone:
    description: Open or administer the native cell phone system
    usage: /cellphone [give <player>|open <player>|reload]
  givephone:
    description: Give a phone to yourself or another player
    usage: /givephone [player]
    permission: vampiresmp.phone.admin
  phonegive:
    description: Give phones to one player or everyone online
    usage: /phonegive <all|player>
    permission: vampiresmp.phone.admin
  checkphonestatus:
    description: Check whether your inventory contains a phone
    usage: /checkphonestatus
  phonereset:
    description: Reset session phone data while preserving social handles
    usage: /phonereset confirm
    permission: vampiresmp.phone.admin
    aliases: [cpreset]
  answer:
    description: Answer an incoming phone call
    usage: /answer
    aliases: [pickup]
  decline:
    description: Decline an incoming phone call
    usage: /decline
    aliases: [reject]
  hangup:
    description: Leave or cancel a phone call
    usage: /hangup
    aliases: [cphangup]
  cpacceptcall:
    description: Internal phone call accept alias
    usage: /cpacceptcall
  cpdeclinecall:
    description: Internal phone call decline alias
    usage: /cpdeclinecall
  cphanghup:
    description: Legacy misspelled phone hangup alias
    usage: /cphanghup
  callmute:
    description: Mute or unmute your microphone for the phone call only
    usage: /callmute
  calldeafen:
    description: Mute or restore incoming phone call audio only
    usage: /calldeafen
  speaker:
    description: Toggle two-way speakerphone mode for your active call
    usage: /speaker

permissions:
  vampiresmp.admin:
    description: Allows access to all vampire SMP admin commands
    default: op

  vampiresmp.player:
    description: Allows access to basic vampire SMP player features
    default: true

  vampiresmp.modgate.bypass:
    description: Exempts the player from the compatibility-mod requirement
    default: op

  vampiresmp.phone.admin:
    description: Allows phone issuing, reload, open, and reset commands
    default: op

  thralls.admin:
    description: Allows access to thrall admin subcommands
    default: op

  starterkit.admin:
    description: Allows access to starter kit admin commands
    default: op

  starterkit.use:
    description: Allows a player to use /starterkit to view their own settings
    default: true
