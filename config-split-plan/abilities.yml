# ============================================================================
#                          ABILITIES CONFIGURATION
# ============================================================================
# All ability cooldowns and tuning parameters for vampires, werewolves, and
# human tome abilities.
# ============================================================================


# ============================================================================
# VAMPIRE ABILITIES  (cooldowns in seconds; 20 ticks = 1 second)
# ============================================================================
abilities:
  vampire:
    # Bat transformation cooldown (default: 900 seconds = 15 minutes)
    bat-cooldown: 900
    bat-cooldown-stage1: 900
    bat-cooldown-stage2: 900
    bat-cooldown-stage3: 900

    # Bat form duration in seconds per stage
    bat-duration-seconds: 120
    bat-duration-seconds-stage1: 120
    bat-duration-seconds-stage2: 120
    bat-duration-seconds-stage3: 180

    # Lunge attack cooldown in seconds
    lunge-cooldown: 45
    lunge-cooldown-stage2: 45
    lunge-cooldown-stage3: 45

    # Lunge launch power per stage (velocity multiplier)
    lunge-strength-stage2: 2.0
    lunge-strength-stage3: 2.5

    # Vanish/Invisibility cooldown in seconds
    vanish-cooldown: 420
    vanish-cooldown-stage2: 420
    vanish-cooldown-stage3: 420

    # Vanish duration in seconds per stage
    vanish-duration-seconds-stage2: 120
    vanish-duration-seconds-stage3: 240

    # Vanish: number of attacks before invisibility breaks
    vanish-attack-limit-stage2: 3
    vanish-attack-limit-stage3: 3

    # Storm Call cooldown and duration
    storm-call-cooldown: 7200
    storm-call-duration-seconds: 600

    # Shadow Travel (Beacon Teleport)
    beacon-teleport-channel-ticks: 100
    beacon-teleport-cooldown: 300
    beacon-teleport-cooldown-stage2: 300
    beacon-teleport-cooldown-stage3: 300
    beacon-teleport-require-full-health: true

    # Vampire Vision cooldown
    vampire-vision-cooldown: 1

    # ── New vampire abilities ────────────────────────────────────────────────
    mistform:
      enabled: true
      cooldown: 30
      distance: 8.0
      protect-ticks: 30
    sanguinebite:
      enabled: true
      cooldown: 20
      range: 4.0
      damage: 4.0
      heal: 6.0
      quench: 15
    hypnoticgaze:
      enabled: true
      cooldown: 45
      range: 12
      duration-ticks: 100
      slowness-amplifier: 2
      blindness-ticks: 60
    bloodscent:
      enabled: true
      cooldown: 30
      radius: 40.0
      health-threshold: 10.0
      duration-ticks: 200
      interval-ticks: 10
    crimsonveil:
      enabled: true
      cooldown: 120
      radius: 8.0
      duration-ticks: 200
      interval-ticks: 20
      vampire-regen-amplifier: 0
      human-weakness-amplifier: 0
    callswarm:
      enabled: true
      cooldown: 60
      radius: 10.0
      duration-ticks: 120
      chip-damage: 1.0
      blindness-ticks: 40
      spawn-bats: true
      bat-count: 6
    sirescommand:
      enabled: true
      cooldown: 90
      duration-ticks: 200
      strength-amplifier: 0
      speed-amplifier: 0


